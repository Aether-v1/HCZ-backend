<div id="kt_content_container" class="app-container container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="card-title flex-wrap gap-3">
                <div class="d-flex align-items-center position-relative my-1 me-3">
                    <span class="svg-icon svg-icon-1 position-absolute ms-4">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect opacity="0.5" x="17.0365" y="15.1223" width="8.15546" height="2" rx="1" transform="rotate(45 17.0365 15.1223)" fill="currentColor" />
                            <path d="M11 19C6.55556 19 3 15.4444 3 11C3 6.55556 6.55556 3 11 3C15.4444 3 19 6.55556 19 11C19 15.4444 15.4444 19 11 19ZM11 5C7.53333 5 5 7.53333 5 11C5 14.4667 7.53333 17 11 17C14.4667 17 17 14.4667 17 11C17 7.53333 14.4667 5 11 5Z" fill="currentColor" />
                        </svg>
                    </span>
                    <input type="text" data-kt="search" class="form-control form-control-solid w-220px ps-15 search" placeholder="搜索内容或IP"/>
                </div>
                <div class="w-200 mw-200px me-3">
                    <input type="text" id="admin_username" class="form-control form-control-solid" placeholder="管理员账号筛选">
                </div>
                <div class="w-180 mw-180px me-3">

                        <option value="">全部模块</option>
                        <option value="管理员管理">管理员管理</option>
                        <option value="系统配置">系统配置</option>
                        <option value="订单管理">订单管理</option>
                        <option value="用户管理">用户管理</option>
                        <option value="财务管理">财务管理</option>
                    </select>
                </div>
                <div class="w-180 mw-180px me-3">
                    <select class="form-select form-select-solid" id="action_filter" data-control="select2" data-placeholder="操作类型筛选">
                        <option></option>
                        <option value="">全部操作</option>
                        <option value="管理员登录成功">管理员登录成功</option>
                        <option value="新增管理员">新增管理员</option>
                        <option value="修改管理员">修改管理员</option>
                        <option value="删除管理员">删除管理员</option>
                        <option value="修改系统配置">修改系统配置</option>
                        <option value="修改支付配置">修改支付配置</option>
                        <option value="修改钱包地址">修改钱包地址</option>
                        <option value="审核订单">审核订单</option>
                        <option value="手动补单">手动补单</option>
                        <option value="手动退款">手动退款</option>
                        <option value="修改用户余额">修改用户余额</option>
                    </select>
                </div>
                <div class="w-300 mw-300px me-3">
                    <div class="d-flex align-items-center position-relative my-1">
                        <span class="svg-icon svg-icon-1 position-absolute ms-4">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path opacity="0.3" d="M20.9 12.9C20.3 12.9 19.9 12.5 19.9 11.9C19.9 11.3 20.3 10.9 20.9 10.9H21.8C21.3 6.2 17.6 2.4 12.9 2V2.9C12.9 3.5 12.5 3.9 11.9 3.9C11.3 3.9 10.9 3.5 10.9 2.9V2C6.19999 2.5 2.4 6.2 2 10.9H2.89999C3.49999 10.9 3.89999 11.3 3.89999 11.9C3.89999 12.5 3.49999 12.9 2.89999 12.9H2C2.5 17.6 6.19999 21.4 10.9 21.8V20.9C10.9 20.3 11.3 19.9 11.9 19.9C12.5 19.9 12.9 20.3 12.9 20.9V21.8C17.6 21.3 21.4 17.6 21.8 12.9H20.9Z" fill="currentColor"/>
                                <path d="M16.9 10.9H13.6C13.4 10.6 13.2 10.4 12.9 10.2V5.90002C12.9 5.30002 12.5 4.90002 11.9 4.90002C11.3 4.90002 10.9 5.30002 10.9 5.90002V10.2C10.6 10.4 10.4 10.6 10.2 10.9H9.89999C9.29999 10.9 8.89999 11.3 8.89999 11.9C8.89999 12.5 9.29999 12.9 9.89999 12.9H10.2C10.4 13.2 10.6 13.4 10.9 13.6V13.9C10.9 14.5 11.3 14.9 11.9 14.9C12.5 14.9 12.9 14.5 12.9 13.9V13.6C13.2 13.4 13.4 13.2 13.6 12.9H16.9C17.5 12.9 17.9 12.5 17.9 11.9C17.9 11.3 17.5 10.9 16.9 10.9Z" fill="currentColor"/>
                            </svg>
                        </span>
                        <input data-kt="time" class="form-control form-control-solid ps-15 time" id="query_time" placeholder="选择日期范围"/>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body pb-5">
            <table id="kt_datatable_example_1" class="table align-middle table-row-dashed fs-6 gy-5">
                <thead>
                    <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase gs-0">
                        <th class="min-w-60px">ID</th>
                        <th class="min-w-140px">操作时间</th>
                        <th class="min-w-120px">管理员</th>
                        <th class="min-w-120px">模块</th>
                        <th class="min-w-120px">操作类型</th>
                        <th class="min-w-320px">操作内容</th>
                        <th class="min-w-120px">IP</th>
                        <th class="min-w-100px text-end">操作</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 fw-semibold"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" tabindex="-1" id="operation_log_detail_modal">
    <div class="modal-dialog modal-dialog-centered mw-700px">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="detail_title">操作记录详情</h3>
                <div class="btn btn-icon btn-sm btn-active-light-primary ms-2" data-bs-dismiss="modal" aria-label="Close">
                    <span class="svg-icon svg-icon-1">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path opacity="0.3" d="M6.7 19.4L5.3 18C4.9 17.6 4.9 17 5.3 16.6L16.6 5.3C17 4.9 17.6 4.9 18 5.3L19.4 6.7C19.8 7.1 19.8 7.7 19.4 8.1L8.1 19.4C7.8 19.8 7.1 19.8 6.7 19.4Z" fill="currentColor"/>
                            <path d="M19.5 18L18.1 19.4C17.7 19.8 17.1 19.8 16.7 19.4L5.40001 8.1C5.00001 7.7 5.00001 7.1 5.40001 6.7L6.80001 5.3C7.20001 4.9 7.80001 4.9 8.20001 5.3L19.5 16.6C19.9 16.9 19.9 17.6 19.5 18Z" fill="currentColor"/>
                        </svg>
                    </span>
                </div>
            </div>
            <div class="modal-body">
                <div class="mb-4">
                    <div class="text-muted fs-7 mb-1" id="detail_meta">-</div>
                    <div class="text-muted fs-7" id="detail_target">-</div>
                    <div class="text-muted fs-7 mt-1" id="detail_ua">-</div>
                </div>
                <div class="border rounded p-4 bg-light-light" id="detail_content" style="white-space: pre-wrap; word-break: break-word; min-height: 140px;"></div>
            </div>
        </div>
    </div>
</div>

{{include file="layout/admin_footer"/}}
<script type="text/javascript">
    $("#query_time").flatpickr({
        dateFormat: "Y-m-d",
        mode: "range"
    });

    let rowDataMap = {};

    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function truncateText(value, length) {
        const text = String(value || '');
        if (text.length <= length) {
            return text;
        }
        return text.substring(0, length - 3) + '...';
    }

    function fillDetail(row) {
        $('#detail_title').text((row.action || '操作记录') + '详情');
        $('#detail_meta').text('管理员：' + (row.admin_username || '-') + ' / 模块：' + (row.module || '-') + ' / 时间：' + (row.create_time || '-') + ' / IP：' + (row.ip || '-'));
        $('#detail_target').text('对象：' + (row.target_type || '无') + (row.target_id ? ' / ID ' + row.target_id : ''));
        $('#detail_ua').text('设备：' + (row.user_agent || '-'));
        $('#detail_content').text(row.content || '-');
    }

    function viewDetail(id) {
        const row = rowDataMap[id];
        if (!row) {
            return;
        }
        fillDetail(row);
        $('#operation_log_detail_modal').modal('show');
    }

    var KTDatatablesServerSide = function () {
        var dt;

        var initDatatable = function () {
            dt = $('#kt_datatable_example_1').DataTable({
                searchDelay: 500,
                processing: true,
                serverSide: true,
                order: [[1, 'desc']],
                stateSave: false,
                pagingType: 'simple_numbers',
                ajax: {
                    url: "{{:getConfig('backstage_entrance')}}/operation_log_list",
                    data: function (d) {
                        d.admin_username = $('#admin_username').val();
                        d.module = $('#module_filter').val();
                        d.action = $('#action_filter').val();
                        d.time_range = $('#query_time').val();
                    }
                },
                columns: [
                    { data: 'id' },
                    { data: 'create_time' },
                    { data: 'admin_username' },
                    { data: 'module' },
                    { data: 'action' },
                    { data: 'content' },
                    { data: 'ip' },
                    { data: null }
                ],
                columnDefs: [
                    {
                        targets: 5,
                        orderable: false,
                        render: function (data) {
                            const text = truncateText(data || '', 70);
                            return '<span title="' + escapeHtml(data || '') + '">' + escapeHtml(text) + '</span>';
                        }
                    },
                    {
                        targets: 7,
                        orderable: false,
                        className: 'text-end',
                        render: function (data, type, row) {
                            return '<a class="btn btn-sm btn-light-primary" href="javascript:void(0)" onclick="viewDetail(' + row.id + ')">查看详情</a>';
                        }
                    }
                ]
            });

            dt.on('xhr', function (e, settings, json) {
                rowDataMap = {};
                (json.data || []).forEach(function (row) {
                    rowDataMap[row.id] = row;
                });
            });

            dt.on('draw', function () {
                KTMenu.createInstances();
            });
        };

        var bindFilters = function () {
            document.querySelector('[data-kt="search"]').addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });

            $('#admin_username').on('keyup', function () {
                dt.draw();
            });

            $('#module_filter, #action_filter, #query_time').on('change', function () {
                dt.draw();
            });
        };

        return {
            init: function () {
                initDatatable();
                bindFilters();
            }
        };
    }();

    KTUtil.onDOMContentLoaded(function () {
        KTDatatablesServerSide.init();
    });
</script>
