<script src="__ADMIN__/js/highlight.min.js"></script>
<script src="__ADMIN__/js/quill.min.js"></script>
<script type="text/javascript">
    $("#query_time").flatpickr({
        dateFormat: "Y-m-d",
        mode: "range"
    });
    var KTDatatablesServerSide = function () {
        var table;
        var dt;
        var filterPayment;
        var initDatatable = function () {
            dt = $("#kt_datatable_example_1").DataTable({
                searchDelay: 500,
                processing: true,
                serverSide: true,
                order: [[15, 'desc']],
                stateSave: false,
                pagingType: 'simple_numbers',
                ajax: {
                    url: "{{:getConfig('backstage_entrance')}}/order_cz_list?uid={{$_REQUEST['uid']|default=''}}",
                },
                columns: [
                    { data: 'id' },
                    { data: null, defaultContent: '' },
                    { data: 'order_number' },
                    { data: null, defaultContent: '' },
                    { data: 'order_info' },
                    { data: 'amount_money' },
                    { data: 'amount_received' },
                    { data: 'discount_amount' },
                    { data: 'discount' },
                    { data: 'rate' },
                    { data: 'cny_amount' },
                    { data: null, defaultContent: '' },
                    { data: null, defaultContent: '' },
                    { data: null, defaultContent: '' },
                    { data: 'export_status' },
                    { data: 'create_time' },
                    { data: null, defaultContent: '' },
                ],
                columnDefs: [
                    {
                        targets: 0,
                        orderable: false,
                        render: function (data) {
                            return `
                            <div class="form-check form-check-sm form-check-custom form-check-solid">
                                <input class="form-check-input form-check-del" type="checkbox" del="del" name="batch_selection" value="${data}" />
                            </div>`;
                        }
                    },
                    {
                        targets: 1,
                        orderable: false,
                        render: function (data, type, row) {
                            return escapeHtml(row.user_info && row.user_info.mobile ? row.user_info.mobile : '-');
                        },
                    },
                    {
                        targets: 2,
                        orderable: false,
                    },
                    {
                        targets: 3,
                        orderable: false,
                        render: function (data, type, row) {
                            const product = row.product_info || {};
                            const safeImage = sanitizeAdminUrl(product.image || '__ADMIN__/media/avatars/blank.png', {
                                fallback: '__ADMIN__/media/avatars/blank.png',
                                allowDataImage: true
                            });
                            return `
                            <div class="d-flex align-items-center mb-7">
                                <div class="symbol symbol-50px me-5">
                                    <div class="symbol symbol-40px">
                                        <img src="${safeImage}" alt="">
                                    </div>
                                </div>
                                <div class="d-flex flex-column">
                                    <a href="#" class="text-gray-900 text-hover-primary fs-6 fw-bold">${escapeHtml(product.name || '-')}</a>
                                    <span class="text-muted fw-bold">充值业务</span>
                                </div>
                            </div>`;
                        },
                    },
                    {
                        targets: 4,
                        orderable: false,
                    },
                    {
                        targets: 5,
                        orderable: false,
                        render: function (amount_money) {
                            return `${amount_money} 元`;
                        },
                    },
                    {
                        targets: 6,
                        orderable: false,
                        render: function (amount_received, type, row) {
                            // 显示实际到账金额，为空时显示"未设置"
                            return amount_received ? `${amount_received} 元` : 
                                   `<span class="text-danger">未设置</span>`;
                        },
                    },
                    {
                        targets: 7,
                        orderable: false,
                        render: function (discount_amount) {
                            return `${discount_amount} 元`;
                        },
                    },
                    {
                        targets: 8,
                        orderable: false,
                        render: function (discount) {
                            if(discount){
                                return `${discount} 折`;
                            }else{
                                return `无折扣`;
                            }
                        },
                    },
                    {
                        targets: 9,
                        orderable: false,
                    },
                    {
                        targets: 10,
                        orderable: false,
                        render: function (cny_amount) {
                            return `$ ${cny_amount} USDT`;
                        },
                    },
                    {
                        targets: 11,
                        orderable: false,
                        render: function (data, type, row) {
                            var onLineStatus = row.user_info && row.user_info.on_line_status !== undefined && row.user_info.on_line_status !== null
                                ? Number(row.user_info.on_line_status)
                                : -1;
                            if(onLineStatus === 0){
                                return `<span class="badge badge-outline badge-danger">不在线</span>`;
                            }else if(onLineStatus === 1){
                                return `<span class="badge badge-outline badge-success">在线</span>`;
                            }
                            return `<span class="badge badge-outline badge-secondary">未知</span>`;
                        },
                    },
                    {
                        targets: 12,
                        orderable: false,
                        render: function (data, type, row) {
                            if(row.status == 0){
                                return `<span class="badge badge-outline badge-primary">待充值</span>`;
                            }else if(row.status == 1){
                                return `<span class="badge badge-outline badge-warning">充值中</span>`;

                            }else if(row.status == 2){
                                return `<span class="badge badge-outline badge-success">已完成</span>`;

                            }else if(row.status == 3){
                                return `<span class="badge badge-outline badge-danger">已取消</span>`;

                            }
                        },
                    },
                    {
                        targets: 13,
                        orderable: false,
                        render: function (data, type, row) {
                            if(row.confirm_status == 0){
                                return `<span class="badge badge-outline badge-dark">未完成</span>`;
                            }else if(row.confirm_status == 1){
                                return `<span class="badge badge-outline badge-warning">待确认</span>`;
                            }else if(row.confirm_status == 2){
                                return `<span class="badge badge-outline badge-success">已确认</span>`;
                            }else if(row.confirm_status == 3){
                                return `<span class="badge badge-outline badge-danger">未收到</span>`;

                            }
                        },
                    },
                    {
                        targets: 14,
                        orderable: false,
                        render: function (export_status) {
                            if(export_status == 0){
                                return `<span class="badge badge-outline badge-dark">未导出</span>`;
                            }else if(export_status == 1){
                                return `<span class="badge badge-outline badge-success">已导出</span>`;
                            }
                        },
                    },
                    {
                        targets: -1,
                        orderable: false,
                        className: 'text-end',
                        render: function (data, type, row) {
                            var status = '';
                            // 添加设置实际到账的操作
                            status += `<a class="menu-link" onclick="showAmountReceivedModal(${row.id})">设置实际到账</a>`;
                            
                            if(row.status == 0){
                                status += `
                                    <a class="menu-link" onclick="audit(1, ${row.id})">充值中</a>
                                    <a class="menu-link" onclick="audit(2, ${row.id})">已完成</a>
                                    <a class="menu-link" onclick="audit(3, ${row.id})">已取消</a>
                                    <a class="menu-link" onclick="audit(0, ${row.id})">待充值</a>
                                    `
                                  
                            }
                            if(row.status == 1){
                                status += `
                                    <a class="menu-link" onclick="audit(2, ${row.id})">已完成</a>
                                    <a class="menu-link" onclick="audit(3, ${row.id})">已取消</a>
                                    <a class="menu-link" onclick="audit(0, ${row.id})">待充值</a>
                                    `
                                  
                            }
                            if(row.status == 2 && row.confirm_status == 3){
                                status += `
                                    <a class="menu-link" onclick="audit(2, ${row.id}, 'confirm_status')">已收到</a>
                                    <a class="menu-link" onclick="audit(3, ${row.id}, 'confirm_status')">已取消</a>
                                    <a class="menu-link" onclick="audit(0, ${row.id})">待充值</a>
                                    `
                                 
                            }
                            return `
                            <a href="#" class="btn btn-light btn-active-light-primary btn-sm" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作
                                <span class="svg-icon svg-icon-5 m-0">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z" fill="currentColor"></path>
                                    </svg>
                                </span>
                            </a>
                            <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-100px py-4" data-kt-menu="true">
                                <div class="menu-item px-3">
                                    ${status}
                                    <!-- a class="menu-link" onclick="del(${row.id})">删除数据</a -->
                                </div>
                            </div>`;
                        },
                    }
                ],
            });
            table = dt.$;
            dt.on('draw', function () {
                initToggleToolbar();
                
                KTMenu.createInstances();
            });
        }
        
        var search = function () {
            const filterSearch = document.querySelector('[data-kt="search"]');
            filterSearch.addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });
        }

        var product = function () {
            const e = document.querySelector('[data-kt="product"]');
            $(e).on("change", (e => {
                if(e.target.value === 'product_all'){
                    dt.column(3).search('').draw();
                }else{
                    dt.column(3).search(e.target.value).draw();
                }
            }))
        }
        var status = function () {
            const e = document.querySelector('[data-kt="status"]');
            $(e).on("change", (e => {
                if(e.target.value === 'status_all'){
                    dt.column(12).search('').draw();
                }else{
                    dt.column(12).search(e.target.value).draw();
                }
            }))
        }
        var time = function () {
            const e = document.querySelector('[data-kt="time"]');
            $(e).on("change", (e => {
                if(e.target.value === 'time_all'){
                    dt.column(15).search('').draw();
                }else{
                    dt.column(15).search(e.target.value).draw();
                }
            }))
        }

        var initToggleToolbar = function () {
            const container = document.querySelector('#kt_datatable_example_1');
            const checkboxes = container.querySelectorAll('[type="checkbox"]');
            checkboxes.forEach(c => {
                c.addEventListener('click', function () {
                    setTimeout(function () {
                        toggleToolbars();
                    }, 50);
                });
            });
        }
        var toggleToolbars = function () {
            const container = document.querySelector('#kt_datatable_example_1');
            const toolbarBase = document.querySelector('[data-kt-docs-table-toolbar="base"]');
            const toolbarSelected = document.querySelector('[data-kt-docs-table-toolbar="selected"]');
            const selectedCount = document.querySelector('[data-kt-docs-table-select="selected_count"]');
            const allCheckboxes = container.querySelectorAll('[del="del"]');
            let checkedState = false;
            let count = 0;
            allCheckboxes.forEach(c => {
                if (c.checked) {
                    checkedState = true;
                    count++;
                }
            });
            if (checkedState) {
                selectedCount.innerHTML = count;
                toolbarBase.classList.add('d-none');
                toolbarSelected.classList.remove('d-none');
            } else {
                toolbarBase.classList.remove('d-none');
                toolbarSelected.classList.add('d-none');
            }
        }
        return {
            init: function (id) {
                initDatatable();
                search();
                product();
                status();
                time();
            }
        }
    }();

    // 显示设置实际到账金额模态框
    function showAmountReceivedModal(id) {
        $('#amountOrderId').val(id);
        $('#amountReceivedValue').val('');
        $('#amountReceivedModal').modal('show');
    }
    
    // 确认设置实际到账金额
    function confirmAmountReceived() {
        const id = $('#amountOrderId').val();
        const amount = $('#amountReceivedValue').val();
        
        if (!amount || isNaN(amount) || parseFloat(amount) < 0) {
            toastr.error('实际到账', {closeButton: true, timeOut: 3000});
            return;
        }
        
        $.ajax({
            url: "{{:getConfig('backstage_entrance')}}/order_post/set_amount_received",
            method: 'POST',
            data: {
                id: id,
                amount_received: amount
            },
            dataType: 'json',
            success: function(res) {
                // 修改成功提示为"批量设置成功"
                toastr.success(
                    '设置成功',  
                    {closeButton: true, timeOut: 3000}
                );
                $('#amountReceivedModal').modal('hide');
                setTimeout(function (){
                    window.location.reload();
                }, 1500);
            },
            error: function() {
                toastr.error('网络错误，请重试', {closeButton: true, timeOut: 3000});
            }
        });
    }
    
    // 批量设置实际到账金额

    function audit(status, id, type = 'status') {
        const auditStatusText = status == 1 ? '通过' : '拒绝';
        Swal.fire({
            html: '<h2>是否确认审核？</h2><p class="text-muted">订单号：' + id + '，审核结果：' + auditStatusText + '</p>',

            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/order_post/audit",
                    method: 'POST',
                    data: {
                        status: status,
                        id: id,
                        type: type,
                    },
                    dataType: 'json',
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            setTimeout(function (){
                                window.location.reload();
                            },1500);
                        } else {
                            toastr.error(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                        }
                    }
                });
            }
        })
    }
