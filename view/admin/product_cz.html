<script src="__ADMIN__/plugins/custom/formrepeater/formrepeater.bundle.js"></script>

<script type="text/javascript">
    var KTDatatablesServerSide = function () {
        var table;
        var dt;
        var filterPayment;
        var initDatatable = function () {
            dt = $("#kt_datatable_example_1").DataTable({
                searchDelay: 500,
                processing: true,
                serverSide: true,
                order: [[6, 'desc']],
                stateSave: false,
                pagingType: 'simple_numbers',
                ajax: {
                    url: "{{:getConfig('backstage_entrance')}}/product_list?type=1",
                },
                columns: [
                    { data: 'id' },
                    { data: 'name' },
                    { data: 'describe' },
                    { data: 'image' },
                    { data: null },
                    { data: null },
                    { data: 'create_time' },
                    { data: null },
                ],
                columnDefs: [
                    {
                        targets: 0,
                        orderable: false,
                        render: function (data) {
                            return `
                            <div class="form-check form-check-sm form-check-custom form-check-solid">
                                <input class="form-check-input form-check-del" type="checkbox" del="del" name="batch_selection" value="${data}" />
                            </div>`;
                        }
                    },
                    {
                        targets: 1,
                        orderable: false,
                    },
                    {
                        targets: 2,
                        orderable: false,
                    },
                    {
                        targets: 3,
                        orderable: false,
                        render: function (image) {
                            return `
                            <div class="cursor-pointer symbol symbol-35px" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
                                <img src="${image||'__ADMIN__/media/avatars/blank.png'}" class="rounded-3" alt="user">
                            </div>`;
                        },
                    },
                    {
                        targets: 4,
                        orderable: false,
                        render: function (data, type, row) {
                            return `
                                <div class="card-toolbar">
                                    <label class="form-check form-switch form-switch-sm form-check-custom form-check-solid">
                                        <input class="form-check-input" type="checkbox" ${row.status ? 'checked="checked"' : '5'}  onclick="status_switch(${row.id})"/>
                                    </label>
                                </div>`;
                        },
                    },
                    {
                        targets: 5,
                        orderable: false,
                        render: function (data, type, row) {
                            return `<input type="text" class="form-control form-control-transparent w-80px" style="padding: 0rem;" placeholder="点击编辑" value="${row.sort}" id="sort_${row.id}" onblur="sort(${row.id});">`;
                        },
                    },
                    {
                        targets: -1,
                        orderable: false,
                        className: 'text-end',
                        render: function (data, type, row) {
                            return `
                            <a href="#" class="btn btn-light btn-active-light-primary btn-sm" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作
                                <span class="svg-icon svg-icon-5 m-0">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z" fill="currentColor"></path>
                                    </svg>
                                </span>
                            </a>
                            <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-125px py-4" data-kt-menu="true">
                                <div class="menu-item px-3">
                                    <a class="menu-link" onclick="product_add_modify(1, ${row.id})" data-kt-menu-trigger="click" id="merchant_add_modify">修改信息</a>
                                    <a class="menu-link" onclick="del(${row.id})">删除产品</a>
                                </div>
                            </div>`;
                        },
                    }
                ],
            });
            table = dt.$;
            dt.on('draw', function () {
                initToggleToolbar();
                KTMenu.createInstances();
            });
        }
        
        var search = function () {
            const filterSearch = document.querySelector('[data-kt="search"]');
            filterSearch.addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });
        }
        
        var getSavedSearchContent = function () {
            var state = dt.state.loaded();
            $(".search").val(state && state.search ? (state.search.search || "") : "");
        };
        var initToggleToolbar = function () {
            const container = document.querySelector('#kt_datatable_example_1');
            const checkboxes = container.querySelectorAll('[type="checkbox"]');
            checkboxes.forEach(c => {
                c.addEventListener('click', function () {
                    setTimeout(function () {
                        toggleToolbars();
                    }, 50);
                });
            });
        }
        var toggleToolbars = function () {
            const container = document.querySelector('#kt_datatable_example_1');
            const toolbarBase = document.querySelector('[data-kt-docs-table-toolbar="base"]');
            const toolbarSelected = document.querySelector('[data-kt-docs-table-toolbar="selected"]');
            const selectedCount = document.querySelector('[data-kt-docs-table-select="selected_count"]');
            const allCheckboxes = container.querySelectorAll('[del="del"]');
            let checkedState = false;
            let count = 0;
            allCheckboxes.forEach(c => {
                if (c.checked) {
                    checkedState = true;
                    count++;
                }
            });
            if (checkedState) {
                selectedCount.innerHTML = count;
                toolbarBase.classList.add('d-none');
                toolbarSelected.classList.remove('d-none');
            } else {
                toolbarBase.classList.remove('d-none');
                toolbarSelected.classList.add('d-none');
            }
        }
        return {
            init: function (id) {
                initDatatable();
                search();
            }
        }
    }();
    KTUtil.onDOMContentLoaded(function () {
        KTDatatablesServerSide.init();
    });

    $('#discount').repeater({
        initEmpty: false,

            'text-input': 'foo'
        },
        show: function () {
            $(this).slideDown();
            $(this).find('input').val('');

    function add_modify() {
        var order_info = [];
        $("div[order_info] div[data-repeater-item]").each(function() {
            var type = $(this).find("#type").val();
            var sort = $(this).find("#sort").val();
            var name = $(this).find("#name").val();
            order_info.push({type: type, sort: sort, name: name});
        });

        var par_value = [];
        $("div[par_value] div[data-repeater-item]").each(function() {
            var name = $(this).find("#name").val();
            var value = $(this).find("#value").val();
            par_value.push({name: name, value: value});
        });

        var discount = [];
        $("div[discount] div[data-repeater-item]").each(function() {
            var mini_amount = $(this).find("#mini_amount").val();
            var maxi_amount = $(this).find("#maxi_amount").val();
            var discounts = $(this).find("#discounts").val();
            discount.push( {mini_amount: mini_amount, maxi_amount: maxi_amount, discount: discounts});
        });
        

        $.ajax({
            url: "{{:getConfig('backstage_entrance')}}/product_post/add_modify",
            method: 'POST',
            data: {
                type: 1,
                id: $('#pid').val(),
                name: $('#name').val(),
                describe: $('#describe').val(),
                tutorial_content: $('#tutorial_content').val(),
                image: $('#image').val(),
                mini_recharge_amount: $('#mini_recharge_amount').val(),
                kickback_rtion_1: $('#kickback_rtion_1').val(),
                kickback_rtion_2: $('#kickback_rtion_2').val(),
                kickback_rtion_3: $('#kickback_rtion_3').val(),
                kickback_rtion_4: $('#kickback_rtion_4').val(),
                kickback_rtion_5: $('#kickback_rtion_5').val(),
                kickback_rtion_6: $('#kickback_rtion_6').val(),
                kickback_rtion_7: $('#kickback_rtion_7').val(),
                kickback_rtion_8: $('#kickback_rtion_8').val(),
                kickback_rtion_9: $('#kickback_rtion_9').val(),
                kickback_rtion_10: $('#kickback_rtion_10').val(),
                batch_status: $('#batch_status').val(),
                product_type: $('#product_type').val(),
                order_info: JSON.stringify(order_info),
                par_value: JSON.stringify(par_value),
                discount: JSON.stringify(discount),
            },
            dataType: 'json',
            success: function(res) {
                if (res.code === 200) {
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                    setTimeout(function (){
                        window.location.reload();
                    },1500);
                } else {
                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });
    }

    function upload(name) {
        var myDropzone = new Dropzone("#" + name, {
            url: "{{:getConfig('backstage_entrance')}}/upload_post",
            paramName: name,
            maxFiles: 1,
            maxFilesize: 5, // MB
            uploadMultiple: false,
            addRemoveLinks: true,
            success: function (file, res) {
                if (res.code === 200) {
                    $('#image').val(res.data);
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                } else {
                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });
        myDropzone.on("addedfile", function(file) {
            if (myDropzone.files.length > 1) {
            myDropzone.removeFile(myDropzone.files[0]);
            }
        });
    }
    window.onload = function() {

    function del(id) {
        Swal.fire({
            html: '<h2>是否确认删除？</h2>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/product_post/del",
                    method: 'POST',
                    data: {
                        id: id,
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            
                            setTimeout(function() {
                                window.location.reload();
                            }, 1500);
                        } else {
                            swal.fire({
                                icon: 'warning',
                                title: res.message
                            });
                        }
                    }
                });
            }
        })
    }
