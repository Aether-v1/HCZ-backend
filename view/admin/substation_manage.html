{{include file="layout/admin_header" web_title="分站管理"}}
<div id="kt_content_container" class="app-container container-fluid">
  <div class="card mb-6">
    <div class="card-header border-0 pt-6">
      <div class="card-title">
        <h3 class="mb-0">分站管理</h3>
      </div>
      <div class="card-toolbar">
        <div class="d-flex flex-wrap gap-3 align-items-center">
          <input type="text" id="keyword" class="form-control form-control-solid w-250px" placeholder="搜索分站ID / 用户ID / 网站名 / 域名">
          <select id="status" class="form-select form-select-solid w-150px">
            <option value="2" selected>仅已开通</option>
            <option value="">全部状态</option>
            <option value="0">未开通</option>
            <option value="1">待审核</option>
            <option value="2">已开通</option>
            <option value="3">已驳回</option>
            <option value="4">已冻结</option>
          </select>
          <button class="btn btn-primary" type="button" onclick="reloadList(1)">查询</button>
        </div>
      </div>
    </div>
    <div class="card-body pt-0">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div class="d-flex gap-2 align-items-center">
          <label class="form-check form-check-sm form-check-custom form-check-solid me-2 mb-0">
            <input class="form-check-input" id="check_all" type="checkbox" onclick="toggleAll(this.checked)">
          </label>
          <span class="text-muted">批量操作</span>
          <button class="btn btn-sm btn-light-warning" type="button" onclick="bulkAction('freeze')">批量冻结</button>
          <button class="btn btn-sm btn-light-success" type="button" onclick="bulkAction('resume')">批量恢复</button>
          <button class="btn btn-sm btn-light-danger" type="button" onclick="bulkAction('cancel')">批量取消分站</button>
          <button class="btn btn-sm btn-light-primary" type="button" onclick="bulkAction('wallet_add')">批量余额加款</button>
          <button class="btn btn-sm btn-light-primary" type="button" onclick="bulkAction('wallet_deduct')">批量余额扣减</button>
        </div>
        <div class="text-muted" id="summary">--</div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle table-row-dashed fs-6 gy-4">
          <thead>
            <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase gs-0">
              <th class="w-10px pe-2"></th>
              <th>分站信息</th>
              <th>用户信息</th>
              <th>域名</th>
              <th>钱包</th>
              <th>状态</th>
              <th>开通时间</th>
              <th class="text-end">操作</th>
            </tr>
          </thead>
          <tbody id="table_body"></tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-5 flex-wrap gap-3">
        <div class="d-flex gap-2 align-items-center flex-wrap">
          <select id="limit" class="form-select form-select-solid w-125px">
            <option value="10">10条/页</option>
            <option value="20" selected>20条/页</option>
            <option value="50">50条/页</option>
            <option value="100">100条/页</option>
          </select>
          <div class="text-muted" id="pager_text">--</div>
        </div>
        <div class="d-flex gap-2 align-items-center">
          <button class="btn btn-sm btn-light" type="button" id="prev_btn" onclick="changePage(-1)">上一页</button>
          <span class="badge badge-light-primary" id="page_no">1 / 1</span>
          <button class="btn btn-sm btn-light" type="button" id="next_btn" onclick="changePage(1)">下一页</button>
        </div>
      </div>
    </div>
  </div>
</div>
{{include file="layout/admin_footer"/}}
<script>
const base='{{:getConfig("backstage_entrance")}}';
let page=1,total=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function statusBadge(v){v=Number(v||0); if(v===2) return '<span class="badge badge-light-success">已开通</span>'; if(v===1) return '<span class="badge badge-light-warning">待审核</span>'; if(v===3) return '<span class="badge badge-light-danger">已驳回</span>'; if(v===4) return '<span class="badge badge-light-dark">已冻结</span>'; return '<span class="badge badge-light">未开通</span>'}
function getCheckedIds(){return $('.row-check:checked').map((_,el)=>$(el).val()).get();}
function toggleAll(checked){$('.row-check').prop('checked',checked);}
async function doAction(action, ids, extra = {}){ if(!ids.length){toastr.warning('请先选择分站'); return;}
  const dangerMap={freeze:{title:'确认冻结分站？',text:'冻结后该分站将无法正常使用',confirm:'确认冻结'},cancel:{title:'确认取消分站？',text:'取消后该分站将被永久移除，此操作不可恢复',confirm:'确认取消'},wallet_deduct:{title:'确认余额扣减？',text:'将从选中分站余额中扣减金额',confirm:'确认扣减'}};
  const d=dangerMap[action];
  if(d){ const {isConfirmed}=await Swal.fire({title:d.title,html:d.text+'<br>即将操作：'+ids.length+' 个分站',icon:'warning',showCancelButton:true,confirmButtonText:d.confirm,cancelButtonText:'取消'}); if(!isConfirmed) return; }
  const res=await $.post(base+'/substation/manage-action',{action,ids:ids.join(','),...extra}); if(res.code===200){toastr.success(res.message||'操作成功'); reloadList(page);}else{toastr.error(res.message||'操作失败');}
}
async function askAdjustPayload(action){
  const title = action==='wallet_add' ? '请输入加款金额(USDT)' : '请输入扣减金额(USDT)';
  const {value:amountVal}=await Swal.fire({title,input:'text',showCancelButton:true,confirmButtonText:'确认',cancelButtonText:'取消'});
  if(amountVal===undefined) return null;
  const n = Number(amountVal);
  if(!Number.isFinite(n) || n<=0){ toastr.warning('请输入正确金额'); return null; }
  const {value:remarkVal}=await Swal.fire({title:'请输入备注(可选)',input:'text',showCancelButton:true,confirmButtonText:'确认',cancelButtonText:'取消'});
  return { amount: n.toFixed(2), remark: remarkVal||'' };
}
async function singleAction(id){ const action=$('#action_'+id).val(); if(!action){toastr.warning('请选择操作'); return;} if(action==='wallet_add' || action==='wallet_deduct'){ const extra = await askAdjustPayload(action); if(!extra) return; doAction(action,[id],extra); return; } doAction(action,[id]); }
async function bulkAction(action){ if(action==='wallet_add' || action==='wallet_deduct'){ const extra = await askAdjustPayload(action); if(!extra) return; doAction(action,getCheckedIds(),extra); return; } doAction(action,getCheckedIds())}
function actionOptions(row){return `
<select id="action_${row.id}" class="form-select form-select-solid form-select-sm w-125px d-inline-block me-2">
  <option value="">选择操作</option>
  <option value="freeze">冻结</option>
  <option value="resume">恢复</option>
  <option value="cancel">取消分站</option>
  <option value="wallet_add">余额加款</option>
  <option value="wallet_deduct">余额扣减</option>
</select>
<button class="btn btn-sm btn-light-primary" type="button" onclick="singleAction(${row.id})">执行</button>
<a class="btn btn-sm btn-light ms-2" href="${base}/substation_order?substation_id=${row.id}">查看订单</a>
<a class="btn btn-sm btn-light-success ms-2" href="${base}/substation_income?substation_id=${row.id}">收益流水</a>`}
async function reloadList(targetPage){ page=targetPage||1; const limit=$('#limit').val(); const keyword=$('#keyword').val(); const status=$('#status').val(); const res=await $.get(base+'/substation/list',{page,limit,keyword,status}); if(res.code!==200){toastr.error(res.message||'加载失败'); return;} const data=res.data||{}; total=Number(data.total||0); const list=Array.isArray(data.list)?data.list:[]; const totalPages=Math.max(1,Math.ceil(total/Number(limit||20))); $('#page_no').text(`${page} / ${totalPages}`); $('#pager_text').text(`共 ${total} 条`); $('#summary').text(`当前显示 ${list.length} 条`); $('#prev_btn').prop('disabled',page<=1); $('#next_btn').prop('disabled',page>=totalPages); $('#check_all').prop('checked',false); const html=list.length?list.map(row=>`<tr><td><label class="form-check form-check-sm form-check-custom form-check-solid"><input class="form-check-input row-check" type="checkbox" value="${row.id}"></label></td><td><div class="fw-bold">${esc(row.site_name||'未命名分站')}</div><div class="text-muted fs-7">分站ID：${row.id}</div></td><td><div>${esc(row.user_mobile||'--')}</div><div class="text-muted fs-7">UID：${row.uid}</div></td><td><div>${esc(row.full_domain||row.subdomain||'--')}</div><div class="text-muted fs-7">前缀：${esc(row.subdomain||'--')}</div></td><td><div>余额：${Number(row.wallet_balance||0).toFixed(2)}U</div><div class="text-muted fs-7">累计入账：${Number(row.wallet_total_income||0).toFixed(2)}U</div></td><td>${statusBadge(row.status)}</td><td>${esc(row.open_time||row.create_time||'--')}</td><td class="text-end">${actionOptions(row)}</td></tr>`).join(''):`<tr><td colspan="8" class="text-center text-muted py-10">暂无数据</td></tr>`; $('#table_body').html(html); }
function changePage(offset){ const limit=Number($('#limit').val()||20); const totalPages=Math.max(1,Math.ceil(total/limit)); const next=Math.min(totalPages,Math.max(1,page+offset)); if(next!==page) reloadList(next); }
$('#limit,#status').on('change',()=>reloadList(1));
$('#keyword').on('keydown',e=>{if(e.key==='Enter') reloadList(1)});
reloadList(1);
</script>
