{{include file="layout/admin_header" web_title="积分记录"/}}
<div id="kt_content_container" class="app-container container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="card-title gap-3">
                <input id="points_keyword" class="form-control form-control-solid w-250px" placeholder="搜索用户/原因">
                <select id="points_type" class="form-select form-select-solid w-150px">
                    <option value="">全部类型</option>
                    <option value="earned">获得</option>
                    <option value="used">使用</option>
                </select>
                <button class="btn btn-light-primary" type="button" onclick="loadPointsRecords(1)">筛选</button>
            </div>
        </div>
        <div class="card-body">
            <table class="table align-middle table-row-dashed fs-6 gy-4">
                <thead>
                    <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase">
                        <th>ID</th>
                        <th>用户</th>
                        <th>类型</th>
                        <th>积分</th>
                        <th>原因</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody id="points_records_body" class="text-gray-700 fw-semibold"></tbody>
            </table>
            <div class="d-flex justify-content-between align-items-center pt-4">
                <div id="points_records_total" class="text-muted"></div>
                <div class="btn-group">
                    <button class="btn btn-sm btn-light" type="button" onclick="loadPointsRecords(currentPage - 1)">上一页</button>
                    <button class="btn btn-sm btn-light" type="button" onclick="loadPointsRecords(currentPage + 1)">下一页</button>
                </div>
            </div>
        </div>
    </div>
</div>
{{include file="layout/admin_footer"/}}
<script>
let currentPage = 1;
let totalPages = 1;

function loadPointsRecords(page) {
    page = Math.max(1, Number(page || 1));
    if (page > totalPages) page = totalPages;
    currentPage = page;
    $.get("{{:getConfig('backstage_entrance')}}/points_records_json", {
        page: currentPage,
        limit: 20,
        keyword: $('#points_keyword').val(),
        type: $('#points_type').val()
    }, function (res) {
        const data = res.data || {};
        const list = Array.isArray(data.list) ? data.list : [];
        const total = Number(data.total || 0);
        totalPages = Math.max(1, Math.ceil(total / Number(data.limit || 20)));
        $('#points_records_total').text(`共 ${total} 条，${currentPage} / ${totalPages}`);
        $('#points_records_body').html(list.length ? list.map(row => {
            const typeText = row.type === 'used' ? '使用' : '获得';
            const badge = row.type === 'used' ? 'badge-light-danger' : 'badge-light-success';
            const points = Number(row.points || 0);
            const sign = row.type === 'used' || points < 0 ? '' : '+';
            const user = `${escapeHtml(row.mobile || row.nickname || '-')}<div class="text-muted fs-7">UID：${escapeHtml(row.uid || '')}</div>`;
            return `<tr>
                <td>${escapeHtml(row.id)}</td>
                <td>${user}</td>
                <td><span class="badge ${badge}">${typeText}</span></td>
                <td>${sign}${escapeHtml(points)}</td>
                <td>${escapeHtml(row.reason || '')}</td>
                <td>${escapeHtml(row.create_time || '')}</td>
            </tr>`;
        }).join('') : '<tr><td colspan="6" class="text-center text-muted py-10">暂无积分记录</td></tr>');
    }, 'json');
}

loadPointsRecords(1);
</script>
