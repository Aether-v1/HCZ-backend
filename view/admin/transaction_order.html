<div id="kt_content_container" class="app-container container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <div class="d-flex align-items-center position-relative my-1 me-3">
                    <span class="svg-icon svg-icon-1 position-absolute ms-4">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect opacity="0.5" x="17.0365" y="15.1223" width="8.15546" height="2" rx="1" transform="rotate(45 17.0365 15.1223)" fill="currentColor" />
                            <path d="M11 19C6.55556 19 3 15.4444 3 11C3 6.55556 6.55556 3 11 3C15.4444 3 19 6.55556 19 11C19 15.4444 15.4444 19 11 19ZM11 5C7.53333 5 5 7.53333 5 11C5 14.4667 7.53333 17 11 17C14.4667 17 17 14.4667 17 11C17 7.53333 14.4667 5 11 5Z" fill="currentColor" />
                        </svg>
                    </span>
                    <input type="text" data-kt="search" class="form-control form-control-solid w-250px ps-15 search" placeholder="模糊搜索 - 请输入内容"/>
                </div>
            </div>
            <div class="card-toolbar flex-row-fluid justify-content-end gap-5">
                <div class="card-toolbar flex-row-fluid justify-content-end gap-5" data-kt-docs-table-toolbar="base"></div>
                <div class="card-toolbar flex-row-fluid justify-content-end gap-5 d-none" data-kt-docs-table-toolbar="selected">
                    <div class="fw-bold me-5">已选择 <span class="me-2" data-kt-docs-table-select="selected_count"></span>条</div>

            </div>

        <div class="card-body pb-5">
            <table id="kt_datatable_example_1" class="table align-middle table-row-dashed fs-6 gy-5">
                <thead>
                    <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase gs-0">
                        <th class="w-10px pe-2">
                            <div class="form-check form-check-sm form-check-custom form-check-solid me-3">
                                <input class="form-check-input form-check-del" type="checkbox" data-kt-check="true" data-kt-check-target="#kt_datatable_example_1 .form-check-del" value="1"/>
                            </div>
                        </th>
                        <th class="min-w-100px">卖家用户</th>
                        <th class="min-w-100px">买家用户</th>
                        <th class="min-w-100px">订单编号</th>
                        <th class="min-w-100px">购买数量</th>
                        <th class="min-w-100px">支付金额</th>
                        <th class="min-w-100px">单价价格</th>
                        <th class="min-w-100px">交易手续费</th>
                        <th class="min-w-100px">到账金额</th>
                        <th class="min-w-100px">真实姓名</th>
                        <th class="min-w-100px">商家收款信息</th>
                        <th class="min-w-100px">凭证图片</th>
                        <th class="min-w-100px">状态</th>
                        <th class="min-w-100px">创建时间</th>
                        <th class="min-w-100px">操作</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 fw-semibold">
                </tbody>
            </table>
        </div>
    </div>
</div>

        <div class="modal-content">
            <div class="modal-header">
                <h2>查看图片</h2>

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
                            <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
                        </svg>
                    </span>
                </div>
            </div>
            <div class="modal-body py-lg-10 px-lg-10 picture_views">
            </div>
        </div>

</div>
{{include file="layout/admin_footer"/}}
<script src="__ADMIN__/js/highlight.min.js"></script>
<script src="__ADMIN__/js/quill.min.js"></script>
<script type="text/javascript">
    var KTDatatablesServerSide = function () {
        var table;
        var dt;
        var filterPayment;
        var initDatatable = function () {
            dt = $("#kt_datatable_example_1").DataTable({
                searchDelay: 500,
                processing: true,
                serverSide: true,
                order: [[13, 'desc']],
                stateSave: false,
                pagingType: 'simple_numbers',
                ajax: {
                    url: "{{:getConfig('backstage_entrance')}}/transaction_order_list?uid={{$_REQUEST['uid']|default=''}}",
                },
                columns: [
                    { data: 'id' },
                    { data: null },
                    { data: null },
                    { data: 'order_number' },
                    { data: 'pay_amount' },
                    { data: 'payment_amount' },
                    { data: 'unit_price' },
                    { data: 'transaction_fees' },
                    { data: 'usdt_amount' },
                    { data: 'remittance_user_name' },
                    { data: 'bank_card_info' },
                    { data: 'voucher_image' },
                    { data: null },
                    { data: 'create_time' },
                    { data: null },
                ],
                columnDefs: [
                    {
                        targets: 0,
                        orderable: false,
                        render: function (data) {
                            return `
                            <div class="form-check form-check-sm form-check-custom form-check-solid">
                                <input class="form-check-input form-check-del" type="checkbox" del="del" name="batch_selection" value="${data}" />
                            </div>`;
                        }
                    },
                    {
                        targets: 1,
                        orderable: false,
                        render: function (data, type, row) {
                            if(row.sell_uid_info){
                                return renderAdminUserBrief(row.sell_uid_info, {
                                    fallback: '__ADMIN__/media/avatars/blank.png'
                                });
                            }else{
                                
                                return `用户不存在`;
                            }
                        },
                    },
                    {
                        targets: 2,
                        orderable: false,
                        render: function (data, type, row) {
                            if(row.user_info){
                                return renderAdminUserBrief(row.user_info, {
                                    fallback: '__ADMIN__/media/avatars/blank.png'
                                });
                            }else{
                                
                                return `用户不存在`;
                            }
                        },
                    },
                    {
                        targets: 3,
                        orderable: false,
                    },
                    {
                        targets: 4,
                        orderable: false,
                    },
                    {
                        targets: 5,
                        orderable: false,
                    },
                    {
                        targets: 6,
                        orderable: false,
                    },
                    {
                        targets: 7,
                        orderable: false,
                    },
                    {
                        targets: 8,
                        orderable: false,
                    },
                    {
                        targets: 9,
                        orderable: false,
                    },
                    {
                        targets: 10,
                        orderable: false,
                        render: function (data, type, row) {
                            return renderAdminBankCardInfo(row.bank_card_info);
                        },
                    },
                    {
                        targets: 11,
                        orderable: false,
                        render: function (voucher_image) {
                            return renderAdminImagePreview(voucher_image, 'picture_views_modal', '__ADMIN__/media/misc/image.png');
                        },
                    },
                    {
                        targets: 12,
                        orderable: false,
                        render: function (data, type, row) {
                            if(row.status == 0){
                                return `<span class="badge badge-light-dark">待汇款</span>`;
                            }
                            if(row.status == 1){
                                return `<span class="badge badge-light-primary">待验收</span>`;
                            }
                            if(row.status == 2){
                                return `<span class="badge badge-light-danger">已取消</span>`;
                            }
                            if(row.status == 3){
                                return `<span class="badge badge-light-success">已完成</span>`;
                            }
                        },
                    },
                    {
                        targets: -1,
                        orderable: false,
                        className: 'text-end',
                        render: function (data, type, row) {
                            var status = '';
                            if(row.status == 1){
                                var status = `
                                    <a class="menu-link" onclick="operate(2, ${row.id})">下架挂单</a>
                                    <a class="menu-link" onclick="operate(3, ${row.id})">撤销挂单</a>`;
                            }
                            if(row.status == 2){
                                var status = `
                                    <a class="menu-link" onclick="operate(1, ${row.id})">上架挂单</a>
                                    <a class="menu-link" onclick="operate(3, ${row.id})">撤销挂单</a>`;
                            }
                            return `
                            <a href="#" class="btn btn-light btn-active-light-primary btn-sm" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作
                                <span class="svg-icon svg-icon-5 m-0">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z" fill="currentColor"></path>
                                    </svg>
                                </span>
                            </a>
                            <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-100px py-4" data-kt-menu="true">
                                <div class="menu-item px-3">
                                    ${status}
                                    <a class="menu-link" onclick="del(${row.id})">删除数据</a>
                                </div>
                            </div>`;
                        },
                    }
                ],
            });
            table = dt.$;
            dt.on('draw', function () {
                initToggleToolbar();
                KTMenu.createInstances();
            });
        }
        
        var search = function () {
            const filterSearch = document.querySelector('[data-kt="search"]');
            filterSearch.addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });
        }
        var getSavedSearchContent = function () {
            var state = dt.state.loaded();
            $(".search").val(state && state.search ? (state.search.search || "") : "");
        };
        
        var initToggleToolbar = function () {
            const container = document.querySelector('#kt_datatable_example_1');
            const checkboxes = container.querySelectorAll('[type="checkbox"]');
            checkboxes.forEach(c => {
                c.addEventListener('click', function () {
                    setTimeout(function () {
                        toggleToolbars();
                    }, 50);
                });
            });
        }
        var toggleToolbars = function () {
            const container = document.querySelector('#kt_datatable_example_1');
            const toolbarBase = document.querySelector('[data-kt-docs-table-toolbar="base"]');
            const toolbarSelected = document.querySelector('[data-kt-docs-table-toolbar="selected"]');
            const selectedCount = document.querySelector('[data-kt-docs-table-select="selected_count"]');
            const allCheckboxes = container.querySelectorAll('[del="del"]');
            let checkedState = false;
            let count = 0;
            allCheckboxes.forEach(c => {
                if (c.checked) {
                    checkedState = true;
                    count++;
                }
            });
            if (checkedState) {
                selectedCount.innerHTML = count;
                toolbarBase.classList.add('d-none');
                toolbarSelected.classList.remove('d-none');
            } else {
                toolbarBase.classList.remove('d-none');
                toolbarSelected.classList.add('d-none');
            }
        }
        return {
            init: function (id) {
                initDatatable();
                search();
            }
        }
    }();
    KTUtil.onDOMContentLoaded(function () {
        KTDatatablesServerSide.init();
    });
    
    function picture_views_modal(picture) {
        showAdminImagePreview('.picture_views', picture, '__ADMIN__/media/misc/image.png');
        $('#picture_views_modal').modal('show');
    }
    
    function del(id) {
        Swal.fire({
            html: '<h2>是否确认删除？</h2>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/transaction_order_post/del",
                    method: 'POST',
                    data: {
                        id: id,
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            
                            setTimeout(function() {
                                window.location.reload();
                            }, 1500);
                        } else {
                            swal.fire({
                                icon: 'warning',
                                title: res.message
                            });
                        }
                    }
                });
            }
        })
    }
    
    
    function dels() {
        Swal.fire({
            html: '<h2>是否确认批量删除？</h2>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                var ids = '';
                $(":checkbox[name='batch_selection']:checked").each(function() {
                    ids += $(this).val() + ",";
                });
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/transaction_order_post/dels",
                    method: 'POST',
                    data: {
                        ids:ids,
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            
                            setTimeout(function() {
                                window.location.reload();
                            }, 1500);
                        } else {
                            swal.fire({
                                icon: 'warning',
                                title: res.message
                            });
                        }
                    }
                });
            }
        })
    }
</script>
