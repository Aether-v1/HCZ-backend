{{include file="layout/admin_header" web_title="首页轮播图"/}}
<div id="kt_content_container" class="app-container container-fluid">
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <div class="d-flex align-items-center position-relative my-1 me-3">
                    <span class="svg-icon svg-icon-1 position-absolute ms-4">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect opacity="0.5" x="17.0365" y="15.1223" width="8.15546" height="2" rx="1" transform="rotate(45 17.0365 15.1223)" fill="currentColor" />
                            <path d="M11 19C6.55556 19 3 15.4444 3 11C3 6.55556 6.55556 3 11 3C15.4444 3 19 6.55556 19 11C19 15.4444 15.4444 19 11 19ZM11 5C7.53333 5 5 7.53333 5 11C5 14.4667 7.53333 17 11 17C14.4667 17 17 14.4667 17 11C17 7.53333 14.4667 5 11 5Z" fill="currentColor" />
                        </svg>
                    </span>
                    <input type="text" data-kt="search" class="form-control form-control-solid w-250px ps-15 search" placeholder="模糊搜索 - 请输入内容"/>
                </div>
            </div>
            <div class="card-toolbar flex-row-fluid justify-content-end gap-5" data-kt-docs-table-toolbar="base">
                <a class="btn btn-sm btn-light btn-light-primary" onclick="slide_modal('add')">
                    添加轮播图
                </a>
            </div>
        </div>
        <div class="card-body pb-5">
            <table id="kt_datatable_example_1" class="table align-middle table-row-dashed fs-6 gy-5">
                <thead>
                    <tr class="text-start text-gray-400 fw-bold fs-7 text-uppercase gs-0">
                        <th class="min-w-100px">ID</th>
                        <th class="min-w-100px">轮播图名称</th>
                        <th class="min-w-100px">轮播图图片</th>
                        <th class="min-w-100px">创建时间</th>
                        <th class="min-w-100px">操作</th>
                    </tr>
                </thead>
                <tbody class="text-gray-600 fw-semibold">
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="slide_modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered mw-500px">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="name"></h2>
                <div class="btn btn-sm btn-icon btn-active-color-primary" data-bs-dismiss="modal">
                    <span class="svg-icon svg-icon-1">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect opacity="0.5" x="6" y="17.3137" width="16" height="2" rx="1" transform="rotate(-45 6 17.3137)" fill="currentColor" />
                            <rect x="7.41422" y="6" width="16" height="2" rx="1" transform="rotate(45 7.41422 6)" fill="currentColor" />
                        </svg>
                    </span>
                </div>
            </div>
            <div class="modal-body py-lg-10 px-lg-10">
                <input type="hidden" id="sid">
                <div class="fv-row row mb-6">
                    <div class="col-md-4 d-flex align-items-center">
                        <label class="fs-6 fw-semibold">轮播图名称</label>
                    </div>
                    <div class="col-md-8">
                        <input type="text" id="name" placeholder="请输入轮播图名称" class="form-control">
                    </div>
                </div>
                <div class="fv-row row">
                    <div class="col-md-4 d-flex align-items-center">
                        <label class="fs-6 fw-semibold">轮播图图片</label>
                    </div>
                    <div class="col-md-8">
                        <div class="input-group image-input">
                            <div class="input-group">
                                <input type="text" class="form-control" id="image" placeholder="请上传轮播图图片">
                                <button class="btn btn-primary dz-clickable" id="upload">
                                    上传图片
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer py-lg-10 px-lg-10">
                <button type="button" class="btn btn-primary" onclick="submit()">提 交</button>
            </div>
        </div>
    </div>
</div>
{{include file="layout/admin_footer"/}}
<script src="__ADMIN__/js/highlight.min.js"></script>
<script src="__ADMIN__/js/quill.min.js"></script>
<script src="https://cdn.staticfile.org/jquery.qrcode/1.0/jquery.qrcode.min.js" type="application/javascript"></script>

<script type="text/javascript">
    var KTDatatablesServerSide = function () {
        var table;
        var dt;
        var filterPayment;
        var initDatatable = function () {
            dt = $("#kt_datatable_example_1").DataTable({
                searchDelay: 500,
                processing: true,
                serverSide: true,
                order: [[3, 'desc']],
                stateSave: false,
                pagingType: 'simple_numbers',
                ajax: {
                    url: "{{:getConfig('backstage_entrance')}}/slide_list",
                },
                columns: [
                    { data: 'id' },
                    { data: 'name' },
                    { data: 'image' },
                    { data: 'create_time' },
                    { data: null },
                ],
                columnDefs: [
                    {
                        targets: 0,
                        orderable: false,
                    },
                    {
                        targets: 1,
                        orderable: false,
                    },
                    {
                        targets: 2,
                        orderable: false,
                        render: function (image) {
                            return `
                            <div class="cursor-pointer symbol symbol-35px">
                                <img src="${image||'__ADMIN__/media/avatars/blank.png'}" class="rounded-3" alt="user">
                            </div>`;
                        },
                    },
                    {
                        targets: -1,
                        orderable: false,
                        className: 'text-end',
                        render: function (data, type, row) {
                            return `
                            <a href="#" class="btn btn-light btn-active-light-primary btn-sm" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作
                                <span class="svg-icon svg-icon-5 m-0">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z" fill="currentColor"></path>
                                    </svg>
                                </span>
                            </a>
                            <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-100px py-4" data-kt-menu="true">
                                <div class="menu-item px-3">
                                    <a class="menu-link" onclick="slide_modal('modify', ${row.id})">编 辑</a>
                                    <a class="menu-link" onclick="del(${row.id})">删 除</a>
                                </div>
                            </div>`;
                        },
                    }
                ],
            });
            table = dt.$;
            dt.on('draw', function () {
                KTMenu.createInstances();
            });
        }
        var search = function () {
            const filterSearch = document.querySelector('[data-kt="search"]');
            filterSearch.addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });
        }
        var getSavedSearchContent = function () {
            var state = dt.state.loaded();
            $(".search").val(state && state.search ? (state.search.search || "") : "");
        };
        return {
            init: function (id) {
                initDatatable();
                search();
            }
        }
    }();
    KTUtil.onDOMContentLoaded(function () {
        KTDatatablesServerSide.init();
    });

    
    function submit() {
        $.ajax({
            url: "{{:getConfig('backstage_entrance')}}/slide_post/submit",
            method: 'POST',
            data: {
                id: $('#sid').val(),
                name: $('#name').val(),
                image: $('#image').val(),
            },
            success: function(res) {
                if (res.code === 200) {
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                    setTimeout(function() {
                        window.location.reload();
                    }, 1500);
                } else {
                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });
    }

    function slide_modal(type, id) {
        if(type == 'add'){
            $('#name').val('');
            $('#image').val('');
            $('.name').html('添加轮播图');
        }else{
            $.ajax({
                url: "{{:getConfig('backstage_entrance')}}/slide_post/info",
                method: 'POST',
                data: {
                    id: id,
                },
                success: function(res) {
                    if (res.code === 200) {
                        $('#sid').val(id);
                        $('#name').val(res.data.name);
                        $('#image').val(res.data.image);
                    } else {
                        toastr.error(
                            res.message,
                            {closeButton :!0, timeOut : "3000"}
                        );
                    }
                }
            });
            $('.name').html('修改轮播图');

        }

        $('#slide_modal').modal('show');
    }

    function del(id) {
        Swal.fire({
            html: '<h2>是否确认删除？</h2><p class="text-muted fs-7">此操作不可恢复</p>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/slide_post/del",
                    method: 'POST',
                    data: {
                        id: id,
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            
                            setTimeout(function() {
                                window.location.reload();
                            }, 1500);
                        } else {
                            toastr.error(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                        }
                    }
                });
            }
        })
    }



    function upload(name) {
        var myDropzone = new Dropzone("#" + name, {
            url: "{{:getConfig('backstage_entrance')}}/upload_post",
            headers: {
                "X-CSRF-Token": adminCsrfToken
            },
            paramName: name,
            maxFiles: 1,
            maxFilesize: 5, // MB
            uploadMultiple: false,
            addRemoveLinks: true,
            success: function (file, res) {
                if (res.code === 200) {
                    $('#image').val(res.data);
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                } else {
                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });
        myDropzone.on("addedfile", function(file) {
            if (myDropzone.files.length > 1) {
            myDropzone.removeFile(myDropzone.files[0]);
            }
        });
    }
    window.onload = function() {
        upload('upload');
    };
</script>
