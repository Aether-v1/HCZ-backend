<script src="__ADMIN__/js/highlight.min.js"></script>

<script type="text/javascript">
    function escapeHtml(value) {
        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    var KTDatatablesServerSide = function () {
        var table;
        var dt;
        var filterPayment;
        var initDatatable = function () {
            dt = $("#kt_datatable_example_1").DataTable({
                searchDelay: 500,
                processing: true,
                serverSide: true,
                order: [[8, 'desc']],
                stateSave: false,
                pagingType: 'simple_numbers',
                ajax: {
                    url: "{{:getConfig('backstage_entrance')}}/user_list",
                },
                columns: [
                    { data: 'id' },
                    { data: null },
                    { data: 'avatar' },
                    { data: 'nickname' },
                    { data: 'mobile' },
                    { data: 'balance' },
                    { data: 'trc20' },
                    { data: null },
                    { data: 'create_time' },
                    { data: null },
                ],
                columnDefs: [
                    {
                        targets: 0,
                        orderable: false,
                    },
                    {
                        targets: 1,
                        orderable: false,
                        render: function (data, type, row) {
                            const parentAvatar = escapeHtml(row.t_user_info?.avatar || '__ADMIN__/media/avatars/blank.png');
                            const parentNickname = escapeHtml(row.t_user_info?.nickname || '');
                            if(row.t_user_info){
                                return `
                                <div class="cursor-pointer symbol symbol-35px" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
                                    <img src="${parentAvatar}" class="rounded-3" alt="user">
                                </div>
                                ${parentNickname}`;
                            }else{
                                return `无上级`;
                            }
                        },
                    },
                    {
                        targets: 2,
                        orderable: false,
                        render: function (avatar) {
                            const safeAvatar = escapeHtml(avatar || '__ADMIN__/media/avatars/blank.png');
                            return `
                            <div class="cursor-pointer symbol symbol-35px" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-attach="parent" data-kt-menu-placement="bottom-end">
                                <img src="${safeAvatar}" class="rounded-3" alt="user">
                            </div>`;
                        },
                    },
                    {
                        targets: 3,
                        orderable: false,
                        render: function (data) {
                            return escapeHtml(data);
                        },
                    },
                    {
                        targets: 4,
                        orderable: false,
                        render: function (data) {
                            return escapeHtml(data);
                        },
                    },
                    {
                        targets: 5,
                        orderable: false,
                        render: function (data, type, row) {
                            const safeMobile = encodeURIComponent(String(row.mobile || ''));
                            return `
                            <div class="flex-grow-1 me-2">
                                <a class="text-gray-800 text-hover-primary">
                                    <span class="text-primary-200 fs-4 fw-bold me-1">${escapeHtml(row.balance)}</span> / USDT
                                </a>
                                <a href="#" class="d-block text-gray-500 text-hover-primary fs-6" onclick="balance(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'))">余额增减</a>
                            </div>`;
                        },
                    },
                    {
                        targets: 6,
                        orderable: false,
                        render: function (data) {
                            return escapeHtml(data);
                        },
                    },
                    {
                        targets: 7,
                        orderable: false,
                        render: function (data, type, row) {
                            return `
                                <div class="card-toolbar">
                                    <label class="form-check form-switch form-switch-sm form-check-custom form-check-solid">
                                        <input class="form-check-input" type="checkbox" ${row.status ? 'checked="checked"' : ''}  onclick="status_switch(${row.id})"/>
                                    </label>
                                </div>`;
                        },
                    },
                    {
                        targets: -1,
                        orderable: false,
                        className: 'text-end',
                        render: function (data, type, row) {
                            const safeMobile = encodeURIComponent(String(row.mobile || ''));
                            return `
                            <a href="#" class="btn btn-light btn-active-light-primary btn-sm" data-kt-menu-trigger="click" data-kt-menu-placement="bottom-end">更多操作
                                <span class="svg-icon svg-icon-5 m-0">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M11.4343 12.7344L7.25 8.55005C6.83579 8.13583 6.16421 8.13584 5.75 8.55005C5.33579 8.96426 5.33579 9.63583 5.75 10.05L11.2929 15.5929C11.6834 15.9835 12.3166 15.9835 12.7071 15.5929L18.25 10.05C18.6642 9.63584 18.6642 8.96426 18.25 8.55005C17.8358 8.13584 17.1642 8.13584 16.75 8.55005L12.5657 12.7344C12.2533 13.0468 11.7467 13.0468 11.4343 12.7344Z" fill="currentColor"></path>
                                    </svg>
                                </span>
                            </a>
                            <div class="menu menu-sub menu-sub-dropdown menu-column menu-rounded menu-gray-600 menu-state-bg-light-primary fw-semibold fs-7 w-100px py-4" data-kt-menu="true">
                                <div class="menu-item px-3">
                                    <a class="menu-link" href="{{:getConfig('backstage_entrance')}}/bank_card?uid=${row.id}">支付管理</a>
                                </div>
                                <div class="menu-item px-3">
                                    <a class="menu-link" href="{{:getConfig('backstage_entrance')}}/user_t?uid=${row.id}">下级用户</a>
                                </div>
                                <div class="menu-item px-3" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-placement="right-start" data-kt-menu-offset="-15px, 0">
                                    <a class="menu-link" href="#">交易明细</a>
                                    <div class="menu-sub menu-sub-dropdown w-150px py-4" style="">
                                        <div class="menu-item px-3">
                                            <a href="{{:getConfig('backstage_entrance')}}/order_cz?uid=${row.id}" class="menu-link d-flex px-5">充值订单数据</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a href="{{:getConfig('backstage_entrance')}}/order_cx?uid=${row.id}" class="menu-link d-flex px-5">查询订单数据</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a href="{{:getConfig('backstage_entrance')}}/recharge?uid=${row.id}" class="menu-link d-flex px-5">余额充值数据</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a href="{{:getConfig('backstage_entrance')}}/withdrawal?uid=${row.id}" class="menu-link d-flex px-5">余额提现数据</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a href="{{:getConfig('backstage_entrance')}}/transaction_order?uid=${row.id}" class="menu-link d-flex px-5">交易订单数据</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="menu-item px-3">
                                    <a class="menu-link" href="{{:getConfig('backstage_entrance')}}/message?uid=${row.id}&account=${encodeURIComponent(row.mobile || '')}">发送消息</a>
                                </div>
                                <div class="menu-item px-3">
                                    <a class="menu-link" onclick="password_modal(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'))">修改密码</a>
                                </div>
                                <div class="menu-item px-3" data-kt-menu-trigger="{default: 'click', lg: 'hover'}" data-kt-menu-placement="right-start" data-kt-menu-offset="-15px, 0">
                                    <a class="menu-link" href="#">权益设置</a>
                                    <div class="menu-sub menu-sub-dropdown w-170px py-4" style="">
                                        <div class="menu-item px-3">
                                            <a class="menu-link d-flex px-5" onclick="rights_action(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'), 'vip_open')">开通VIP</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a class="menu-link d-flex px-5" onclick="rights_action(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'), 'vip_close')">关闭VIP</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a class="menu-link d-flex px-5" onclick="rights_action(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'), 'svip_open')">开通SVIP</a>
                                        </div>
                                        <div class="menu-item px-3">
                                            <a class="menu-link d-flex px-5" onclick="rights_action(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'), 'svip_close')">关闭SVIP</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="menu-item px-3">
                                    <a class="menu-link ${Number(row.twofa_enabled || 0) === 1 ? 'text-danger' : 'text-muted'}" onclick="unbind_user_twofa(${Number(row.id) || 0}, decodeURIComponent('${safeMobile}'), ${Number(row.twofa_enabled || 0)})">
                                        ${Number(row.twofa_enabled || 0) === 1 ? '解绑2FA' : '2FA未启用'}
                                    </a>
                                </div>
                                <div class="menu-item px-3">
                                    <a class="menu-link" onclick="del(${row.id})">删除用户</a>
                                </div>

                                </div>
                            </div>`;
                        },
                    }
                ],
            });
            table = dt.$;
            dt.on('draw', function () {
                KTMenu.createInstances();
            });
        }
        
        var search = function () {
            const filterSearch = document.querySelector('[data-kt="search"]');
            filterSearch.addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });
        }

        var getSavedSearchContent = function () {
            var state = dt.state.loaded();
            $(".search").val(state && state.search ? (state.search.search || "") : "");
        };
        return {
            init: function (id) {
                initDatatable();
                search();
            }
        }
    }();
    KTUtil.onDOMContentLoaded(function () {
        KTDatatablesServerSide.init();
    });

    function del(id) {
        Swal.fire({
            html: '<h2>是否确认删除？</h2>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/user_post/del",
                    method: 'POST',
                    data: {
                        id: id,
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            
                            setTimeout(function() {
                                window.location.reload();
                            }, 1500);
                        } else {
                            swal.fire({
                                icon: 'warning',
                                title: res.message
                            });
                        }
                    }
                });
            }
        })
    }
    
    function password_modal(id, mobile) {
        $("#uid").val(id);
        $(".mobile").text(mobile);
        $('#password_modal').modal('show');
    }
    function password_submit() {
        $.ajax({
            url: "{{:getConfig('backstage_entrance')}}/user_post/password",
            method: 'POST',
            data: {
                uid: $('#uid').val(),
                password: $('#password').val(),
            },
            dataType: 'json',
            success: function(res) {
                if (res.code === 200) {
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                    setTimeout(function (){
                        window.location.reload();
                    },1500);
                } else {
                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });
    }
    
    
    
    function balance(id,mobile) {
        $("#uid").val(id);
        $(".mobile").text(mobile);
        $('#balance_modal').modal('show');
    }
    
    function balance_submit() {
        withAdminSensitiveAuth('请完成余额变更安全验证', function (authPayload) {
            $.ajax({
                url: "{{:getConfig('backstage_entrance')}}/user_post/balance",
                method: 'POST',
                data: Object.assign({
                    uid: $('#uid').val(),
                    balance_cz: $('#balance_cz').val(),
                    add_minus: $("input[name='add_minus']:checked").val(),
                }, authPayload || {}),
                dataType: 'json',
                success: function(res) {
                    if (res.code === 200) {
                        toastr.success(
                            res.message,
                            {closeButton :!0, timeOut : "3000"}
                        );
                        setTimeout(function (){
                            window.location.reload();
                        },1500);
                    } else {
                        toastr.error(
                            res.message,
                            {closeButton :!0, timeOut : "3000"}
                        );
                    }
                }
            });
        });
    }
    
    function status_switch(uid) {
        $.ajax({
            url: "{{:getConfig('backstage_entrance')}}/user_post/status_switch",
            method: 'POST',
            data: {
                uid: uid,
            },
            dataType: 'json',
            success: function(res) {
                if (res.code === 200) {
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                } else {
                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });
    }

    function unbind_user_twofa(uid, mobile, twofaEnabled) {
        if (Number(twofaEnabled || 0) !== 1) {
            toastr.info(
                '该用户当前未启用2FA',
                {closeButton :!0, timeOut : "3000"}
            );
            return;
        }

        Swal.fire({
            html: `<h2>确认解绑用户 2FA？</h2><div class="text-muted fs-6 mt-2">账户：${escapeHtml(mobile || '')}<br>解绑后该用户需要重新绑定才能恢复2FA保护。</div>`,
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '继续解绑',
            customClass: {
                denyButton: "btn btn-light me-6",
                confirmButton: 'btn btn-danger'
            }
        }).then((result) => {
            if (!result.isConfirmed) {
                return;
            }

            withAdminSensitiveAuth('请完成用户2FA解绑安全验证', function (authPayload) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/user_post/twofa_unbind",
                    method: 'POST',
                    data: Object.assign({
                        uid: uid,
                    }, authPayload || {}),
                    dataType: 'json',
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            setTimeout(function (){
                                window.location.reload();
                            },1500);
                        } else {
                            toastr.error(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                        }
                    }
                });
            });
        });
    }

    function rightsActionLabel(action) {
        return {
            vip_open: '开通VIP',
            vip_close: '关闭VIP',
            svip_open: '开通SVIP',
            svip_close: '关闭SVIP',
        }[action] || '权益设置';
    }

    function rights_action(uid, mobile, action) {
        const actionLabel = rightsActionLabel(action);
        Swal.fire({
            html: `<h2>确认执行 ${escapeHtml(actionLabel)}？</h2><div class="text-muted fs-6 mt-2">账户：${escapeHtml(mobile || '')}</div>`,
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确认',
            customClass: {
                denyButton: "btn btn-light me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (!result.isConfirmed) {
                return;
            }

            withAdminSensitiveAuth(`请完成${actionLabel}安全验证`, function (authPayload) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/user_post/rights",
                    method: 'POST',
                    data: Object.assign({
                        uid: uid,
                        rights_action: action,
                    }, authPayload || {}),
                    dataType: 'json',
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            setTimeout(function (){
                                window.location.reload();
                            },1000);
                        } else {
                            toastr.error(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                        }
                    }
                });
            });
        });
    }
</script>
