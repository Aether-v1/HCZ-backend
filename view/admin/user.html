        return String(value || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

        var search = function () {
            const filterSearch = document.querySelector('[data-kt="search"]');
            filterSearch.addEventListener('keyup', function (e) {
                dt.search(e.target.value).draw();
            });
        }

        var getSavedSearchContent = function () {
            var state = dt.state.loaded();
            $(".search").val(state && state.search ? (state.search.search || "") : "");
        };

            init: function (id) {
                initDatatable();
                search();
            }
        }
    }();
    KTUtil.onDOMContentLoaded(function () {
        KTDatatablesServerSide.init();
    });

    function del(id) {
        Swal.fire({
            html: '<h2>是否确认删除？</h2><p class="text-muted fs-7">此操作不可恢复</p>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确定',
            customClass: {
                denyButton: "btn btn-danger me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (result.isConfirmed) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/user_post/del",
                    method: 'POST',
                    data: {
                        id: id,
                    },
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            
                            setTimeout(function() {
                                window.location.reload();
                            }, 1500);
                        } else {
                            swal.fire({
                                icon: 'warning',
                                title: res.message
                            });
                        }
                    }
                });
            }
        })
    }
    
    function password_modal(id, mobile) {
        $("#uid").val(id);
        $(".mobile").text(mobile);
        $('#password_modal').modal('show');
    }
    function password_submit() {
        $.ajax({
            url: "{{:getConfig('backstage_entrance')}}/user_post/password",
            method: 'POST',
            data: {
                uid: $('#uid').val(),
                password: $('#password').val(),
            },
            dataType: 'json',
            success: function(res) {
                if (res.code === 200) {
                    toastr.success(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                    setTimeout(function (){
                        window.location.reload();
                    },1500);

                    toastr.error(
                        res.message,
                        {closeButton :!0, timeOut : "3000"}
                    );
                }
            }
        });

    function balance(id,mobile) {
        $("#uid").val(id);
        $(".mobile").text(mobile);
        $('#balance_modal').modal('show');
    }
    
    function balance_submit() {
        withAdminSensitiveAuth('请完成余额变更安全验证', function (authPayload) {
            $.ajax({
                url: "{{:getConfig('backstage_entrance')}}/user_post/balance",
                method: 'POST',
                data: Object.assign({
                    uid: $('#uid').val(),
                    balance_cz: $('#balance_cz').val(),

                }, authPayload || {}),

                    if (res.code === 200) {
                        toastr.success(
                            res.message,
                            {closeButton :!0, timeOut : "3000"}
                        );

                            window.location.reload();

                            res.message,
                            {closeButton :!0, timeOut : "3000"}

    function status_switch(uid) {
        Swal.fire({
            html: '<h2>是否切换用户状态？</h2><p class="text-muted">用户ID：' + uid + '</p><p class="text-warning fs-7">启用/禁用将立即生效，影响用户登录和下单</p>',
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确认切换',
            customClass: {
                denyButton: "btn btn-light me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (!result.isConfirmed) return;
            $.ajax({
                url: "{{:getConfig('backstage_entrance')}}/user_post/status_switch",
                method: 'POST',
                data: { uid: uid },
                dataType: 'json',
                success: function(res) {
                    if (res.code === 200) {
                        toastr.success(res.message, {closeButton: true, timeOut: 3000});
                        setTimeout(function(){ window.location.reload(); }, 1000);
                    } else {
                        toastr.error(res.message, {closeButton: true, timeOut: 3000});
                    }
                }
            });
        });
    }

    function unbind_user_twofa(uid, mobile, twofaEnabled) {
        if (Number(twofaEnabled || 0) !== 1) {
            toastr.info(
                '该用户当前未启用2FA',
                {closeButton :!0, timeOut : "3000"}
            );
            return;
        }

        Swal.fire({
            html: `<h2>确认解绑用户 2FA？</h2><div class="text-muted fs-6 mt-2">账户：${escapeHtml(mobile || '')}<br>解绑后该用户需要重新绑定才能恢复2FA保护。</div>`,
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '继续解绑',
            customClass: {
                denyButton: "btn btn-light me-6",
                confirmButton: 'btn btn-danger'
            }
        }).then((result) => {
            if (!result.isConfirmed) {
                return;
            }

            withAdminSensitiveAuth('请完成用户2FA解绑安全验证', function (authPayload) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/user_post/twofa_unbind",
                    method: 'POST',
                    data: Object.assign({
                        uid: uid,
                    }, authPayload || {}),
                    dataType: 'json',
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            setTimeout(function (){
                                window.location.reload();
                            },1500);
                        } else {
                            toastr.error(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                        }
                    }
                });
            });
        });
    }

    function rightsActionLabel(action) {
        return {
            vip_open: '开通VIP',
            vip_close: '关闭VIP',
            svip_open: '开通SVIP',
            svip_close: '关闭SVIP',
        }[action] || '权益设置';
    }

    function rights_action(uid, mobile, action) {
        const actionLabel = rightsActionLabel(action);
        Swal.fire({
            html: `<h2>确认执行 ${escapeHtml(actionLabel)}？</h2><div class="text-muted fs-6 mt-2">账户：${escapeHtml(mobile || '')}</div>`,
            showDenyButton: true,
            reverseButtons: true,
            denyButtonText: '取消',
            confirmButtonText: '确认',
            customClass: {
                denyButton: "btn btn-light me-6",
                confirmButton: 'btn btn-primary'
            }
        }).then((result) => {
            if (!result.isConfirmed) {
                return;
            }

            withAdminSensitiveAuth(`请完成${actionLabel}安全验证`, function (authPayload) {
                $.ajax({
                    url: "{{:getConfig('backstage_entrance')}}/user_post/rights",
                    method: 'POST',
                    data: Object.assign({
                        uid: uid,
                        rights_action: action,
                    }, authPayload || {}),
                    dataType: 'json',
                    success: function(res) {
                        if (res.code === 200) {
                            toastr.success(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                            setTimeout(function (){
                                window.location.reload();
                            },1000);
                        } else {
                            toastr.error(
                                res.message,
                                {closeButton :!0, timeOut : "3000"}
                            );
                        }
                    }
                });
            });
        });
    }

    // 用户详情弹窗
    window._userRowData = window._userRowData || {};
    function showUserDetail(id) {
        var row = window._userRowData[id];
        if (!row) { toastr.error('用户数据未找到', {closeButton: true, timeOut: 3000}); return; }
        document.getElementById('userDetailId').textContent = row.id || '-';
        document.getElementById('userDetailName').textContent = '#' + (row.id || '');
        document.getElementById('userDetailNickname').textContent = row.nickname || row.mobile || '-';
        document.getElementById('userDetailNickname2').textContent = row.nickname || '-';
        document.getElementById('userDetailMobile').textContent = row.mobile || '-';
        document.getElementById('userDetailMobile2').textContent = row.mobile || '-';
        document.getElementById('userDetailRegTime').textContent = row.create_time || row.register_time || row.add_time || '-';
        document.getElementById('userDetailOnline').innerHTML = row.on_line_status == 1 ? '<span class="badge badge-light-success">在线</span>' : '<span class="badge badge-light-secondary">离线</span>';
        document.getElementById('userDetailBalance').textContent = row.balance !== undefined ? ('¥' + row.balance) : (row.money !== undefined ? ('¥' + row.money) : '-');
        var ti = row.t_user_info || {};
        document.getElementById('userDetailTeam').textContent = ti.nickname ? (ti.nickname + ' (ID:' + ti.id + ')') : '无';
        var st = row.status == 1 || row.status == 'normal' ? ['正常', 'success'] : (row.status == 0 ? ['禁用', 'danger'] : ['未知', 'secondary']);
        document.getElementById('userDetailStatus').className = 'badge fs-6 px-4 py-2 badge-light-' + st[1];
        document.getElementById('userDetailStatus').textContent = st[0];
        document.getElementById('userDetailStatus2').textContent = st[0];
        if (row.avatar) { document.getElementById('userDetailAvatar').src = row.avatar; }
        // 快捷链接 - 带 uid 参数
        var base = "{{:getConfig('backstage_entrance')}}";
        document.getElementById('userDetailOrders').href = base + '/admin/order_cz?uid=' + row.id;
        document.getElementById('userDetailRecharge').href = base + '/admin/recharge?uid=' + row.id;
        document.getElementById('userDetailWithdraw').href = base + '/admin/withdrawal?uid=' + row.id;
        document.getElementById('userDetailToggleStatus').onclick = function() { $('#userDetailModal').modal('hide'); status_switch(row.id); };
        $('#userDetailModal').modal('show');
    }
</script>
